<!doctype html>
<html lang="en">
  <head>
    <title>Flash Cards</title>
    <meta name="author" content="Jamar Pridgen" />
    <meta
      name="description"
      content="a flash card study tool that is available to study html code"
    />
    <meta name="keywords" content="flash cards, study, html, simple" />
    <link rel="icon" type="image/x-icon" href="/app/favicon.ico" />
    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="carousel" id="carousel">
        <h2 class="carousel__title">HTML tags deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">&lt; body&gt; &lt;/body&gt;</p>
          </div>
          <button class="carousel__btn carousel__btn_type_right"></button>
        </div>
        <button class="carousel__btn carousel__btn_type_flip"></button>
      </section>
      <div class="decks" id="home">
        <h2 class="decks__title">My Decks</h2>
        <div class="decks__rows">
          <ul class="decks__list">
            <template id="deck-template">
              <li class="deck deck_color_green">
                <a class="deck__link" href="#"></a>
                <p class="deck__title"></p>
                <div class="deck__row">
                  <span class="deck__count"></span>
                  <button
                    class="deck__delete-btn"
                    type="button"
                    aria-label="Delete this deck"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button class="decks__new-deck-btn" type="button">+ New Deck</button>
        </div>
      </div>
      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Jamar Pridgen</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
